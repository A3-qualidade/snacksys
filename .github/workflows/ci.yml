name: SnackSys CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: snacksys
          POSTGRES_USER: snacksys
          POSTGRES_PASSWORD: snacksys_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snacksys -d snacksys"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/snacksys
      DB_USER: snacksys
      POSTGRES_PASSWORD: snacksys_ci

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Executar testes e gerar cobertura
        run: ./mvnw -B clean verify

      - name: Armazenar relatorio JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Analise SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=a3-qualidade
          -Dsonar.projectKey=A3-qualidade_snacksys
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
