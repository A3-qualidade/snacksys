
services:
  postgres:
    image: postgres:17
    container_name: snacksys-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: snacksys
      POSTGRES_USER: snacksys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snacksys -d snacksys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
